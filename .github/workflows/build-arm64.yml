name: Build WinSW for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Suppress Vulnerability Warnings
        shell: pwsh
        run: |
          $props = @"
          <Project>
            <PropertyGroup>
              <NuGetAudit>false</NuGetAudit>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <NoWarn>`$(NoWarn);NU1902;NU1903;NU1904;NETSDK1138</NoWarn>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props

      - name: Publish WinSW for win-arm64
        run: |
          dotnet publish src/WinSW/WinSW.csproj `
            -c Release `
            -f net7.0-windows `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o ./dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinSW-arm64
          path: ./dist/WinSW.exe
